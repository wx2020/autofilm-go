<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFilm</title>
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.bootcdn.net/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div id="app" style="display:none">
  <div class="d-flex" style="height:100vh">
    <nav class="sidebar d-flex flex-column flex-shrink-0 p-3 bg-dark text-white">
      <a href="/" class="d-flex align-items-center mb-3 text-white text-decoration-none">
        <i class="bi-film me-2 fs-4"></i><span class="fs-5">AutoFilm</span>
      </a><hr>
      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item" v-for="item in navItems" :key="item.path">
          <router-link :to="item.path" class="nav-link text-white" active-class="active">
            <i :class="item.icon" class="me-2"></i>{{ item.label }}
          </router-link>
        </li>
      </ul><hr>
      <div class="text-white-50 small" id="ver">v{{ version }}</div>
    </nav>
    <main class="flex-grow-1 p-4 bg-light" style="overflow-y:auto">
      <router-view />
    </main>
  </div>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/vue/3.5.13/vue.global.prod.js"></script>
<script src="https://cdn.bootcdn.net/ajax/libs/vue-router/4.5.0/vue-router.global.prod.js"></script>
<script>
try {
if(typeof Vue === 'undefined') {
  document.getElementById('app').style.display = 'block';
  document.getElementById('app').innerHTML = '<div class="p-5 text-center"><h3 class="text-danger">加载失败</h3><p>Vue.js 未加载，请检查网络或手动刷新。</p><button class="btn btn-primary" onclick="location.reload()">刷新</button></div>';
  throw new Error('Vue not loaded');
}

const { createApp, ref, reactive, onMounted, watch, nextTick } = Vue
const { createRouter, createWebHistory } = VueRouter
const $api = u => fetch(u,{headers:{'Content-Type':'application/json'}}).then(r=>r.json())
const $post = (u,b) => fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):void 0}).then(r=>r.json())

// ---- 组件 ----
const ModuleCard = { props:['m'], emits:['run','toggle'],
  template:`<div class="card mb-2"><div class="card-body py-2">
    <div class="d-flex justify-content-between align-items-start">
      <div><h6 class="mb-0">{{m.id}}</h6>
        <span class="badge" :class="m.enabled?'bg-success':'bg-secondary'">{{m.enabled?'已启用':'已禁用'}}</span>
        <span class="badge bg-info ms-1">{{m.type}}</span></div>
      <div class="d-flex gap-1">
        <button class="btn btn-sm" :class="m.enabled?'btn-warning':'btn-success'" @click="$emit('toggle')"><i :class="m.enabled?'bi-pause':'bi-play'"></i></button>
        <button class="btn btn-sm btn-primary" @click="$emit('run')" :disabled="!m.enabled">运行</button></div></div>
    <div class="mt-1 small text-muted">
      <span v-if="m.cron">Cron <code>{{m.cron}}</code></span>
      <span v-if="m.next_run" class="ms-2">下次 {{new Date(m.next_run).toLocaleString('zh-CN')}}</span>
      <span v-if="m.last_error" class="ms-2 text-danger">{{m.last_error}}</span></div>
  </div></div>` }

const Nav = {props:['items'], template:`<ul class="nav nav-pills flex-column mb-auto">
  <li class="nav-item" v-for="item in items" :key="item.path">
    <router-link :to="item.path" class="nav-link text-white" active-class="active">
      <i :class="item.icon" class="me-2"></i>{{ item.label }}
    </router-link>
  </li>
</ul>`}

// ---- Views ----
const Overview = {
  template:`<div><h4><i class="bi-speedometer2 me-2"></i>概览</h4>
    <div class="row mb-3"><div class="col-md-3 mb-2" v-for="s in stats" :key="s.label">
      <div class="card text-center"><div class="card-body"><h5>{{s.c}}</h5><p class="text-muted mb-0">{{s.label}}</p></div></div></div></div>
    <ModuleCard v-for="m in ms" :key="m.type+m.id" :m="m" @run="run(m)" @toggle="toggle(m)"/>
    <p v-if="!ms.length" class="text-muted mt-3">暂无模块</p></div>`,
  components:{ModuleCard},
  setup(){const ms=ref([]);const stats=ref([]);const load=async()=>{const a=await $api('/api/modules');ms.value=a;stats.value=[{label:'Alist2Strm',c:a.filter(x=>x.type==='alist2strm').length},{label:'Ani2Alist',c:a.filter(x=>x.type==='ani2alist').length},{label:'封面',c:a.filter(x=>x.type==='libraryposter').length},{label:'同步',c:a.filter(x=>x.type==='alissync').length}]};onMounted(load);const run=async x=>{await $post('/api/modules/'+x.type+'/'+x.id+'/run');load()};const toggle=async x=>{await $post('/api/modules/'+x.type+'/'+x.id+'/toggle');load()};return {ms,stats,run,toggle}}
}

// 配置管理表单组件（内嵌于模块页）
const CfgMgr = { props:['type'],
  template:`<div class="mt-4">
    <h5 class="mb-2"><i class="bi-gear me-1"></i>{{type==='alissync'?'同步':'模块'}}配置 <button class="btn btn-sm btn-success" @click="edit({})"><i class="bi-plus"></i> 新增</button></h5>
    <table class="table table-sm table-hover" v-if="list.length">
      <thead><tr><th>ID</th><th v-if="type!=='alissync'">源目录</th><th v-if="type!=='alissync'">目标目录</th><th>Cron</th><th></th></tr></thead>
      <tbody><tr v-for="c in list" :key="c.id">
        <td>{{c.id}}</td><td v-if="type!=='alissync'" class="text-truncate" style="max-width:180px">{{c.source_dir}}</td>
        <td v-if="type!=='alissync'" class="text-truncate" style="max-width:180px">{{c.target_dir}}</td>
        <td><code>{{c.cron}}</code></td>
        <td><button class="btn btn-sm btn-outline-danger py-0" @click="del(c.id)"><i class="bi-trash"></i></button></td></tr>
      </tbody></table>
    <p v-else class="text-muted small">暂无配置</p>
    <div v-if="showForm" class="modal d-block" style="background:rgba(0,0,0,.5)">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header py-2"><span class="modal-title small">{{form.id?'编辑':'新增'}} {{type}}</span>
          <button type="button" class="btn-close btn-close-sm" @click="showForm=false"></button></div>
        <div class="modal-body py-2">
          <div class="mb-1"><input v-model="form.id" class="form-control form-control-sm" placeholder="ID"></div>
          <div class="mb-1"><input v-model="form.url" class="form-control form-control-sm" placeholder="http://localhost:5244"></div>
          <div class="mb-1"><input v-model="form.token" class="form-control form-control-sm" placeholder="Token"></div>
          <div v-if="type==='alist2strm'" class="row g-1 mb-1"><div class="col"><input v-model="form.source_dir" class="form-control form-control-sm" placeholder="源目录"></div>
            <div class="col"><input v-model="form.target_dir" class="form-control form-control-sm" placeholder="目标目录"></div></div>
          <div class="mb-1"><input v-model="form.cron" class="form-control form-control-sm" placeholder="Cron 表达式"></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" v-model="form.enable" id="fe"><label class="form-check-label small" for="fe">启用</label></div>
        </div>
        <div class="modal-footer py-1"><button class="btn btn-sm btn-secondary" @click="showForm=false">取消</button>
          <button class="btn btn-sm btn-primary" @click="save" :disabled="saving">{{saving?'...':'保存'}}</button></div>
      </div></div>
    </div>
    <div v-if="msg" class="small mt-1" :class="mT">{{msg}}</div>
  </div>`,
  setup(props){
    const list=ref([]);const showForm=ref(false);const saving=ref(false);const msg=ref('');const mT=ref('')
    const form=reactive({id:'',url:'',token:'',source_dir:'',target_dir:'',cron:'',enable:true})
    const show=(t,c)=>{msg.value=t;mT.value=c||'text-success';setTimeout(()=>msg.value='',4000)}
    const load=async()=>{try{const d=await $api('/api/configs/'+(props.type==='alist2strm'?'alist2strm':props.type));list.value=d}catch(e){}}
    const edit=(c)=>{Object.assign(form,{id:'',url:'',token:'',source_dir:'',target_dir:'',cron:'',enable:true},c);showForm.value=true}
    const save=async()=>{saving.value=true;try{const b={id:form.id,url:form.url,token:form.token,enable:form.enable,cron:form.cron};if(props.type==='alist2strm'){b.source_dir=form.source_dir;b.target_dir=form.target_dir}const d=await $post('/api/configs/'+props.type,b);if(d.success){showForm.value=false;load();show('已保存')}else show('失败','text-danger')}catch(e){show(e.message,'text-danger')}finally{saving.value=false}}
    const del=async id=>{if(!confirm('删除 '+id+' ?'))return;try{const r=await fetch('/api/configs/'+props.type+'/'+id,{method:'DELETE'});const d=await r.json();if(d.success)load()}catch(e){}}
    onMounted(load);return {list,showForm,saving,msg,mT,form,edit,save,del}
  }
}

const ModPage = (type,title,icon)=>({components:{ModuleCard,CfgMgr},
  template:`<div><h4><i :class="icon+' me-2'"></i>{{title}}</h4>
    <ModuleCard v-for="m in ms" :key="m.type+m.id" :m="m" @run="run(m)" @toggle="toggle(m)"/>
    <p v-if="!ms.length" class="text-muted mt-3">暂无模块</p>
    <CfgMgr :type="type"/> </div>`,
  setup(){const ms=ref([]);const load=async()=>{const a=await $api('/api/modules');ms.value=a.filter(x=>x.type===type)};onMounted(load);const run=async x=>{await $post('/api/modules/'+x.type+'/'+x.id+'/run')};const toggle=async x=>{await $post('/api/modules/'+x.type+'/'+x.id+'/toggle');load()};return {ms,run,toggle}}
})

const Sync = {components:{ModuleCard,CfgMgr},
  template:`<div><h4><i class="bi-arrow-left-right me-2"></i>同步</h4>
    <div class="table-responsive mb-2"><table class="table table-sm table-hover"><thead><tr>
      <th>源</th><th>目标</th><th>状态</th><th>次数</th><th>错误</th><th></th></tr></thead>
      <tbody><tr v-for="t in tasks" :key="t.id">
        <td class="text-truncate" style="max-width:160px">{{t.src_path}}</td>
        <td class="text-truncate" style="max-width:160px">{{t.dst_path}}</td>
        <td><span class="badge" :class="scls(t.state)">{{t.state}}</span></td>
        <td>{{t.attempts}}</td><td class="text-danger text-truncate" style="max-width:160px">{{t.last_error}}</td>
        <td><button class="btn btn-sm btn-outline-primary" @click="retry(t.id)" :disabled="t.state==='running'||t.state==='succeeded'">重试</button></td></tr>
    </tbody></table></div>
    <ModuleCard v-for="m in mods" :key="m.type+m.id" :m="m" @run="run(m)" @toggle="toggle(m)"/>
    <CfgMgr type="alissync"/></div>`,
  setup(){const tasks=ref([]);const mods=ref([]);const scls=s=>({pending:'bg-secondary',running:'bg-primary',succeeded:'bg-success',failed:'bg-warning text-dark',dead_letter:'bg-danger'}[s]||'bg-secondary');const load=async()=>{const[a,b]=await Promise.all([$api('/api/sync/queue'),$api('/api/modules')]);tasks.value=a;mods.value=b.filter(x=>x.type==='alissync')};onMounted(load);const retry=async id=>{await $post('/api/sync/queue/retry/'+id);load()};const run=async x=>{await $post('/api/modules/'+x.type+'/'+x.id+'/run')};const toggle=async x=>{await $post('/api/modules/'+x.type+'/'+x.id+'/toggle');load()};return {tasks,mods,scls,retry,run,toggle}}
}

const Settings = {
  template:`<div><h4><i class="bi-gear me-2"></i>设置</h4>
    <div class="alert alert-info py-2"><i class="bi-info-circle me-2"></i>保存后触发热重载，cron 自动重建。</div>
    <textarea v-model="raw" class="form-control font-monospace mb-2" rows="20"></textarea>
    <button class="btn btn-primary" @click="save" :disabled="saving"><i class="bi-save me-2"></i>{{saving?'保存中...':'保存'}}</button>
    <div v-if="msg" class="mt-2 alert py-2" :class="mT">{{msg}}</div></div>`,
  setup(){const raw=ref('');const saving=ref(false);const msg=ref('');const mT=ref('alert-success');const show=(t,c)=>{msg.value=t;mT.value=c;setTimeout(()=>msg.value='',5000)};onMounted(async()=>{const d=await $api('/api/config');raw.value=d.raw||''});const save=async()=>{saving.value=true;try{const d=await $post('/api/config',{raw:raw.value});d.success?show('已保存，任务已重建'):show(d.error||'失败','alert-danger')}catch(e){show(e.message,'alert-danger')}finally{saving.value=false}};return {raw,saving,msg,mT,save}}
}

const Logs = {
  template:`<div><h4><i class="bi-journal-text me-2"></i>日志</h4>
    <div class="mb-2 d-flex gap-2 align-items-center flex-wrap">
      <button class="btn btn-sm" :class="streaming?'btn-danger':'btn-success'" @click="toggle"><i :class="streaming?'bi-stop':'bi-play'"></i> {{streaming?'停止':'实时'}}</button>
      <button class="btn btn-sm btn-outline-secondary" @click="loadLogs"><i class="bi-arrow-clockwise"></i> 刷新</button>
      <select v-model="level" class="form-select form-select-sm" style="width:auto" @change="loadLogs">
        <option value="">全部</option><option>info</option><option>warn</option><option>error</option><option>debug</option></select></div>
    <div class="log-box"><div v-for="(l,i) in lines" :key="i">{{l}}</div><div v-if="!lines.length" class="text-muted">暂无</div></div></div>`,
  setup(){const lines=ref([]);const streaming=ref(false);const level=ref('');let ws=null;const loadLogs=async()=>{try{const d=await $api('/api/logs?lines=500'+(level.value?'&level='+level.value:''));lines.value=d}catch(e){}};const toggle=()=>{streaming.value?(ws&&(ws.close(),ws=null),streaming.value=false):(ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/api/logs/stream'),ws.onopen=()=>streaming.value=true,ws.onmessage=e=>{lines.value.push(e.data);lines.value.length>1000&&lines.value.shift()},ws.onclose=()=>streaming.value=false,ws.onerror=()=>streaming.value=false)};onMounted(loadLogs);return {lines,streaming,level,loadLogs,toggle}}
}



// ---- 路由 ----
const routes = [
  {path:'/',component:Overview},
  {path:'/alist2strm', component:ModPage('alist2strm','Alist2Strm','bi-link-45deg')},
  {path:'/ani2alist', component:ModPage('ani2alist','Ani2Alist','bi-film')},
  {path:'/libraryposter', component:ModPage('libraryposter','封面','bi-image')},
  {path:'/sync',component:Sync},
  {path:'/settings',component:Settings},
  {path:'/logs',component:Logs},
]

// ---- 启动 ----
const router = createRouter({history:createWebHistory(),routes})
const app = createApp({components:{Nav},
  data:()=>({version:'dev',navItems:[
    {path:'/',label:'概览',icon:'bi-speedometer2'},
    {path:'/alist2strm',label:'Alist2Strm',icon:'bi-link-45deg'},
    {path:'/ani2alist',label:'Ani2Alist',icon:'bi-film'},
    {path:'/libraryposter',label:'封面',icon:'bi-image'},
    {path:'/sync',label:'同步',icon:'bi-arrow-left-right'},
    {path:'/settings',label:'设置',icon:'bi-gear'},
    {path:'/logs',label:'日志',icon:'bi-journal-text'}]})
})
app.use(router)
app.mount('#app')
document.getElementById('app').style.display = ''

// 版本号
fetch('/api/health').then(r=>r.json()).then(d=>{if(d.version)document.getElementById('ver').textContent='v'+d.version}).catch(()=>{})

} catch(e) {
  document.getElementById('app').style.display = 'block'
  document.getElementById('app').innerHTML = '<div class="p-5 text-center"><h4 class="text-danger">启动失败</h4><p class="text-muted">'+e.message+'</p><pre class="text-start bg-light p-3 mt-3" style="max-width:600px;margin:auto;overflow:auto">'+e.stack+'</pre></div>'
  console.error(e)
}
</script>
</body>
</html>
