name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ['1.24', '1.25']

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (with race)
        run: go test -race -v -timeout 120s ./...

      - name: go test coverage
        run: |
          go test -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out
        shell: bash

  race-stress-test:
    name: Race Stress Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: GlobalStore race stress test
        run: go test -race -count=100 -v ./internal/storage/ -run TestGlobalStoreRace

      - name: GlobalStore concurrent stress test
        run: go test -race -count=100 -v ./internal/storage/ -run TestConcurrentSetGlobalStore

      - name: GetClient race stress test
        run: go test -race -count=100 -v ./pkg/alist/ -run TestGetClientRace

      - name: GetClient duplicate creation test
        run: go test -race -count=100 -v ./pkg/alist/ -run TestGetClientDuplicateCreation

      - name: SaveSnapshot integrity test
        run: go test -race -count=50 -v ./internal/storage/ -run TestSaveSnapshot
