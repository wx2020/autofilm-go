version: '3.8'

services:
  autofilm:
    image: akimio/autofilm-go:latest
    container_name: autofilm
    restart: unless-stopped

    volumes:
      - ./config:/config
      - ./logs:/logs
      - ./fonts:/fonts:ro
      - ./media:/media
      - ./data:/data

    ports:
      - "8080:8080"

    environment:
      - TZ=Asia/Shanghai
      - AUTOFILM_WEB_HOST=0.0.0.0
      # 建议取消注释并设置强随机 Token，公网部署必须设置
      # - AUTOFILM_WEB_TOKEN=change-me

    # 如果需要查看日志
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
